name: Install 3of5 4of5 Predictor
on:
  push:
    paths:
      - '.github/workflows/add-3of5-4of5-predictor.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch predictor
        run: echo '' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add 3of5 4of5 independent predictor'; git push; fi
