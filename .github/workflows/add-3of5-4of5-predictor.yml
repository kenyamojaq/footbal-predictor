name: History Only 3of5 4of5 Predictor
on:
  push:
    paths:
      - '.github/workflows/add-3of5-4of5-predictor.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Convert predictor to history only
        run: echo ''  ' | base64 -d | python3
      - name: Commit changes
        run: |
          git config user.name "kenyamojaq"
          git config user.email "kenyamojaq@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make 3of5 4of5 predictor history-only"
            git push
          fi
