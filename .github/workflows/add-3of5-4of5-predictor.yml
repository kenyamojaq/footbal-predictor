name: Supplied 3of5 4of5 History Predictor
on:
  push:
    paths:
      - '.github/workflows/add-3of5-4of5-predictor.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch predictor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new=r'''function threeFourIndependent(inp){
            const hist=[
              ['3/5',19.1,14.8,16.1,'3-1'],['3/5',19.8,12.2,18.0,'0-3'],['3/5',13.9,21.4,14.6,'1-0'],
              ['3/5',18.9,20.6,10.5,'1-0'],['3/5',21.6,12.7,15.6,'1-0'],['3/5',20.4,13.0,16.6,'0-2'],
              ['3/5',22.0,19.2,8.8,'1-0'],['3/5',18.9,19.8,11.2,'3-0'],['3/5',18.4,16.6,15.0,'0-1'],
              ['4/5',15.8,14.4,19.8,'1-3'],['4/5',25.2,15.8,9.0,'1-0'],['4/5',16.2,15.1,18.7,'2-1'],
              ['4/5',25.9,10.8,13.3,'0-1'],['4/5',14.4,7.9,27.7,'2-0'],['4/5',20.8,13.9,15.3,'4-2']
            ].map(([group,h,d,a,score])=>{
              const [hg,ag]=score.split('-').map(Number);
              return {group,h,d,a,score,result:hg>ag?'1':hg<ag?'2':'X'};
            });
            const z=(1/inp.home)+(1/inp.draw)+(1/inp.away);
            const cur={h:50*(1/inp.home)/z,d:50*(1/inp.draw)/z,a:50*(1/inp.away)/z};
            const dist=r=>Math.sqrt((r.h-cur.h)**2+(r.d-cur.d)**2+(r.a-cur.a)**2);
            const nearest=hist.slice().sort((a,b)=>dist(a)-dist(b));
            const use=nearest.slice(0,7), tally={'1':0,'X':0,'2':0};
            use.forEach((r,i)=>tally[r.result]+=1/(1+i*.22));
            const order=['1','X','2'].sort((a,b)=>tally[b]-tally[a]);
            const top=order[0],second=order[1],total=tally['1']+tally.X+tally['2'];
            const pct=total?tally[top]/total:0, gap=total?(tally[top]-tally[second])/total:0;
            const best=nearest[0];
            const groupCounts={'3/5':0,'4/5':0}; use.slice(0,5).forEach(r=>groupCounts[r.group]++);
            const group=groupCounts['4/5']>groupCounts['3/5']?'4/5':'3/5';
            const strength=Math.round(clamp(24 + pct*18 + gap*16,0,50));
            const status=pct>=.58?'STRONG HISTORY':pct>=.45?'HISTORY LEAN':'CAUTION';
            return {top,second,pct,gap,strength,status,group,cur,nearest,use,best,hist};
          }

          function renderThreeFourIndependent(inp){
            const f=threeFourIndependent(inp);
            byId('threeFourPick').textContent=`${f.group} ${f.status}: ${LABEL[f.top]}`;
            byId('threeFourScore').textContent=`${f.strength}/50`;
            byId('threeFourSummary').textContent=`Uses ONLY the 15 supplied 3/5–4/5 historical rows. Current odds convert to H ${f.cur.h.toFixed(1)}/50, D ${f.cur.d.toFixed(1)}/50, A ${f.cur.a.toFixed(1)}/50. Nearest historical pattern: ${f.best.group} H ${f.best.h}/50 D ${f.best.d}/50 A ${f.best.a}/50, score ${f.best.score}.`;
            byId('threeFourGrid').innerHTML=f.use.slice(0,5).map((r,i)=>`<div class="three-four-card"><b>${i+1}. ${r.group} history</b><span>H ${r.h}/50 · D ${r.d}/50 · A ${r.a}/50<br>Score ${r.score} → ${LABEL[r.result]}</span></div>`).join('');
            const w=byId('threeFourWarning');
            w.className='three-four-warning '+(f.pct>=.45?'strong':'caution');
            w.textContent=`HISTORY-ONLY SIGNAL: ${Math.round(f.pct*100)}% weighted support for ${LABEL[f.top]} from the nearest supplied records. No Oracle, Scoreline, 50-Point, Pattern Cluster, or other archive history is used.`;
            return f;
          }'''
          pat=r'function threeFourIndependent\([^\)]*\)\{.*?function renderThreeFourIndependent\([^\)]*\)\{.*?\n\}'
          s2,n=re.subn(pat,new,s,count=1,flags=re.S)
          if n!=1:
            raise SystemExit(f'predictor block match count={n}')
          s2=s2.replace('Special consensus check for 3/5 and 4/5 situations across the five existing predictors.','Uses only your supplied 3/5 and 4/5 history rows; independent of all other predictors.')
          s2=re.sub(r'renderThreeFourIndependent\(inp\s*,[^;]+\)', 'renderThreeFourIndependent(inp)', s2)
          p.write_text(s2,encoding='utf-8')
          PY
          if ! git diff --quiet -- index.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html
            git commit -m "Use only supplied 3of5 4of5 history"
            git push
          fi
