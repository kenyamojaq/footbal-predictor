name: Final Engine vs Supplied 3of5 4of5 History
on:
  push:
    paths:
      - '.github/workflows/add-3of5-4of5-predictor.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch final-engine history reviewer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          new=r'''function threeFourIndependent(finalDecision){
            const hist=[
              ['3/5',19.1,14.8,16.1,'3-1'],['3/5',19.8,12.2,18.0,'0-3'],['3/5',13.9,21.4,14.6,'1-0'],
              ['3/5',18.9,20.6,10.5,'1-0'],['3/5',21.6,12.7,15.6,'1-0'],['3/5',20.4,13.0,16.6,'0-2'],
              ['3/5',22.0,19.2,8.8,'1-0'],['3/5',18.9,19.8,11.2,'3-0'],['3/5',18.4,16.6,15.0,'0-1'],
              ['4/5',15.8,14.4,19.8,'1-3'],['4/5',25.2,15.8,9.0,'1-0'],['4/5',16.2,15.1,18.7,'2-1'],
              ['4/5',25.9,10.8,13.3,'0-1'],['4/5',14.4,7.9,27.7,'2-0'],['4/5',20.8,13.9,15.3,'4-2']
            ].map(([group,h,d,a,score])=>{
              const [hg,ag]=score.split('-').map(Number);
              return {group,h,d,a,score,result:hg>ag?'1':hg<ag?'2':'X'};
            });

            if(!finalDecision || !finalDecision.score){
              return {ready:false,hist};
            }

            const engine={
              h:50*Number(finalDecision.score['1']||0),
              d:50*Number(finalDecision.score.X||0),
              a:50*Number(finalDecision.score['2']||0)
            };
            const engineTop=finalDecision.top;
            const agreement=Number(finalDecision.agreement||0);
            const engineGroup=agreement>=4?'4/5':agreement===3?'3/5':null;

            const dist=r=>Math.sqrt((r.h-engine.h)**2+(r.d-engine.d)**2+(r.a-engine.a)**2);
            const groupPenalty=r=>engineGroup && r.group!==engineGroup ? 4.5 : 0;
            const topPenalty=r=>r.result===engineTop ? 0 : 1.5;
            const ranked=hist.slice().sort((a,b)=>(dist(a)+groupPenalty(a)+topPenalty(a))-(dist(b)+groupPenalty(b)+topPenalty(b)));
            const use=ranked.slice(0,7);
            const tally={'1':0,'X':0,'2':0};
            use.forEach((r,i)=>{
              const similarity=1/(1+dist(r)/9);
              const rankWeight=1/(1+i*.18);
              const groupWeight=engineGroup && r.group===engineGroup ? 1.25 : 1;
              tally[r.result]+=similarity*rankWeight*groupWeight;
            });
            const order=['1','X','2'].sort((a,b)=>tally[b]-tally[a]);
            const top=order[0],second=order[1];
            const total=tally['1']+tally.X+tally['2']||1;
            const support=tally[top]/total;
            const gap=(tally[top]-tally[second])/total;
            const agreesWithEngine=top===engineTop;
            let strength=24+support*17+gap*13+(agreesWithEngine?4:0)+(engineGroup==='4/5'?2:0);
            strength=Math.round(clamp(strength,0,50));
            const status=agreesWithEngine
              ? (support>=.55?'CONFIRMS FINAL ENGINE':'LEAN CONFIRMATION')
              : (support>=.50?'HISTORY OVERRIDES':'HISTORY DISAGREES');

            return {ready:true,hist,engine,engineTop,engineGroup,agreement,ranked,use,tally,top,second,support,gap,strength,status,agreesWithEngine,best:ranked[0]};
          }

          function renderThreeFourIndependent(finalDecision){
            const f=threeFourIndependent(finalDecision);
            if(!f.ready){
              byId('threeFourPick').textContent='Awaiting Final Decision Engine';
              byId('threeFourScore').textContent='--/50';
              byId('threeFourSummary').textContent='This reviewer runs only after the Final Decision Engine has produced its prediction.';
              byId('threeFourGrid').innerHTML='';
              byId('threeFourWarning').textContent='';
              return f;
            }

            byId('threeFourPick').textContent=`${f.status}: ${LABEL[f.top]}`;
            byId('threeFourScore').textContent=`${f.strength}/50`;
            byId('threeFourSummary').textContent=`Final Engine says ${LABEL[f.engineTop]} with ${f.agreement}/5 agreement and H ${f.engine.h.toFixed(1)}/50, D ${f.engine.d.toFixed(1)}/50, A ${f.engine.a.toFixed(1)}/50. This is compared ONLY with your 15 supplied 3/5–4/5 history records before this reviewer makes its own opinion.`;
            byId('threeFourGrid').innerHTML=f.use.slice(0,5).map((r,i)=>`<div class="three-four-card"><b>${i+1}. ${r.group} match</b><span>H ${r.h}/50 · D ${r.d}/50 · A ${r.a}/50<br>Score ${r.score} → ${LABEL[r.result]}</span></div>`).join('');
            const w=byId('threeFourWarning');
            w.className='three-four-warning '+(f.agreesWithEngine?'strong':'caution');
            w.textContent=f.agreesWithEngine
              ? `HISTORY CHECK CONFIRMS FINAL ENGINE: ${Math.round(f.support*100)}% weighted historical support for ${LABEL[f.top]}. Reviewer decision strength ${f.strength}/50.`
              : `HISTORY CHECK DISAGREES WITH FINAL ENGINE: Final Engine=${LABEL[f.engineTop]}, 15-row history reviewer=${LABEL[f.top]} with ${Math.round(f.support*100)}% weighted support. Treat this as caution.`;
            return f;
          }'''

          pat=r'function threeFourIndependent\([^\)]*\)\{.*?function renderThreeFourIndependent\([^\)]*\)\{.*?\n\}'
          s2,n=re.subn(pat,new,s,count=1,flags=re.S)
          if n!=1:
            raise SystemExit(f'predictor block match count={n}')

          old='''  const clusterRes=renderPatternClusterPredictor(inp);\n  const threeFourRes=renderThreeFourIndependent(inp);\n  const finalDecision=renderFinalDecisionEngine(inp,r,scorelineRes,independentRes,fiftyRes,clusterRes);'''
          newer='''  const clusterRes=renderPatternClusterPredictor(inp);\n  const finalDecision=renderFinalDecisionEngine(inp,r,scorelineRes,independentRes,fiftyRes,clusterRes);\n  const threeFourRes=renderThreeFourIndependent(finalDecision);'''
          if old not in s2:
            raise SystemExit('render order block not found')
          s2=s2.replace(old,newer,1)
          s2=s2.replace('Uses only your supplied 3/5 and 4/5 history rows; independent of all other predictors.','Runs after the Final Decision Engine, compares its output against your 15 supplied 3/5–4/5 history rows, then gives its own opinion.')
          s2=s2.replace('Special consensus check for 3/5 and 4/5 situations across the five existing predictors.','Runs after the Final Decision Engine, compares its output against your 15 supplied 3/5–4/5 history rows, then gives its own opinion.')

          p.write_text(s2,encoding='utf-8')
          PY
          if ! git diff --quiet -- index.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html
            git commit -m "Review final engine against supplied 15-row history"
            git push
          fi
