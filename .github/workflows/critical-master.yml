name: Install Critical Master
on:
  push:
    paths:
      - 'patch_critical.py'
      - '.github/workflows/critical-master.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 patch_critical.py
      - name: Commit changes
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html
            git commit -m "Add critical master decision layer"
            git push
          fi
