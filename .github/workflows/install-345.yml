name: Install 3of5 4of5 Predictor
on:
  push:
    paths:
      - '.github/workflows/install-345.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- THREE-FOUR-FIVE-INDEPENDENT -->'
          if marker in s:
              print('Already installed')
              raise SystemExit(0)
          html=r'''<!-- THREE-FOUR-FIVE-INDEPENDENT -->
<section class="panel pad three-four-panel">
  <div class="title">3/5 – 4/5 Independent Predictor</div>
  <div class="three-four-head">
    <div><h2 id="threeFourPick">Awaiting model outputs</h2><p id="threeFourSummary">Special consensus check for 3/5 and 4/5 situations. It compares Oracle Fusion, Scoreline, Independent, 50-Point and Pattern Cluster.</p></div>
    <div class="three-four-score"><b id="threeFourScore">--/50</b><span>Decision strength</span></div>
  </div>
  <div class="three-four-grid" id="threeFourGrid"></div>
  <div class="three-four-warning" id="threeFourWarning"></div>
</section>
'''
          css=r'''
.three-four-panel{margin-top:16px;border:1px solid var(--blue);background:linear-gradient(180deg,#141820,#0d1118)}
.three-four-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.three-four-head h2{margin:0 0 6px;font-size:28px}.three-four-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.three-four-score{text-align:center;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 18px;min-width:120px}.three-four-score b{display:block;font-size:30px;color:var(--blue)}.three-four-score span{color:var(--muted);font-size:11px}.three-four-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.three-four-card{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px;min-height:78px}.three-four-card b{display:block;font-size:13px;margin-bottom:5px}.three-four-card span{color:var(--muted);font-size:11px;line-height:1.35}.three-four-warning{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--panel2);font-size:12px;line-height:1.45;color:var(--muted)}.three-four-warning.strong{border-color:var(--home);color:var(--text)}.three-four-warning.caution{border-color:var(--away);color:var(--away)}
@media(max-width:900px){.three-four-head,.three-four-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.three-four-head,.three-four-grid{grid-template-columns:1fr}.three-four-score{justify-self:start}}
'''
          js=r'''
function threeFourIndependent(inp,oracle,scoreline,independent,fifty,cluster){
  const votes=[
    {name:'Oracle Fusion',top:oracle?.top,weight:.22},
    {name:'Scoreline',top:scoreline?.ranked?.[0]?resultFromScore(scoreline.ranked[0].score):null,weight:.16},
    {name:'Independent',top:independent?.top,weight:.22},
    {name:'50-Point',top:fifty?.top,weight:.20},
    {name:'Pattern Cluster',top:cluster?.top,weight:.20}
  ].filter(x=>x.top);
  const counts={'1':0,'X':0,'2':0},weighted={'1':0,'X':0,'2':0};
  votes.forEach(v=>{counts[v.top]++;weighted[v.top]+=v.weight});
  const order=['1','X','2'].sort((a,b)=>weighted[b]-weighted[a]);
  const top=order[0],second=order[1],count=counts[top],gap=weighted[top]-weighted[second];
  const consensus=count>=5?'5/5':count===4?'4/5':count===3?'3/5':count+'/5';
  const market=implied(inp.home,inp.draw,inp.away);
  const marketTop=['1','X','2'].sort((a,b)=>market[b]-market[a])[0];
  const marketSupports=marketTop===top;
  const scorelineSupports=scoreline?.ranked?.[0]?resultFromScore(scoreline.ranked[0].score)===top:false;
  let strength=50*weighted[top];
  if(count>=4)strength+=7;else if(count===3)strength+=2;
  if(marketSupports)strength+=3;if(scorelineSupports)strength+=3;if(gap<.06)strength-=8;
  strength=Math.round(clamp(strength,0,50));
  const clean4=count===4&&gap>=.10&&marketSupports;
  const clean3=count===3&&gap>=.08&&marketSupports&&scorelineSupports;
  const status=clean4?'STRONG 4/5':clean3?'QUALIFIED 3/5':count>=3?'CAUTION '+consensus:'NO CONSENSUS';
  return {votes,top,second,count,gap,consensus,strength,status,marketSupports,scorelineSupports,minority:votes.filter(v=>v.top!==top).map(v=>v.name),caution:!clean4&&!clean3};
}
function renderThreeFourIndependent(inp,oracle,scoreline,independent,fifty,cluster){
  const f=threeFourIndependent(inp,oracle,scoreline,independent,fifty,cluster);
  byId('threeFourPick').textContent=`${f.status}: ${LABEL[f.top]}`;
  byId('threeFourScore').textContent=`${f.strength}/50`;
  byId('threeFourSummary').textContent=`${f.consensus} consensus for ${LABEL[f.top]}. Weighted lead over ${LABEL[f.second]}: ${(f.gap*100).toFixed(1)} points.`;
  byId('threeFourGrid').innerHTML=f.votes.map(v=>`<div class="three-four-card"><b>${v.name}</b><span>${LABEL[v.top]}${v.top===f.top?' ✓ majority':''}</span></div>`).join('');
  const w=byId('threeFourWarning');w.className='three-four-warning '+(f.caution?'caution':'strong');
  w.textContent=f.caution?`CAUTION: ${f.consensus} is not clean enough. Market support: ${f.marketSupports?'YES':'NO'}; scoreline support: ${f.scorelineSupports?'YES':'NO'}. Minority: ${f.minority.length?f.minority.join(', '):'none'}.`:`ACCEPTABLE: ${f.consensus} for ${LABEL[f.top]}, supported by the market and scoreline. ${f.strength}/50 is decision strength, not probability.`;
  return f;
}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('<!-- FINAL-DECISION-ENGINE -->',html+'\n<!-- FINAL-DECISION-ENGINE -->',1)
          s=s.replace('function render() {',js+'\nfunction render() {',1)
          old='  const clusterRes=renderPatternClusterPredictor(inp);'
          new=old+'\n  renderThreeFourIndependent(inp,r,scorelineRes,independentRes,fiftyRes,clusterRes);'
          if old not in s:
              raise SystemExit('render insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Patched index.html')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add visible 3of5 4of5 independent predictor'
          git push
