name: Apply Critical Notes Live Result
on:
  push:
    paths:
      - 'patch_notes_live.py'
      - '.github/workflows/notes-live.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch notes history
        run: python3 patch_notes_live.py
      - name: Commit result lesson
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html
            git commit -m "Learn from Critical Master 32/50 home win 3-1"
            git push
          fi
