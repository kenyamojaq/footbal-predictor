name: Fix football predictor performance
on:
  push:
    paths:
      - '.github/workflows/fix-performance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch predictor for mobile performance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          # Stop the expensive model from running automatically on page load.
          s=s.replace('\nrender();', '\n// render(); // disabled automatic startup calculation')
          # Stop recalculation on every odds keystroke.
          s=s.replace('["home","draw","away","dc1x","dcx2","bankroll","maxStake"].forEach(id=>byId(id).addEventListener("input",render));', '["home","draw","away","dc1x","dcx2","bankroll","maxStake"].forEach(id=>byId(id).addEventListener("input",()=>{}));')
          # Replace the normal run binding with a guarded, delayed call.
          s=s.replace('byId("run").onclick=render;', 'byId("run").onclick=()=>{ if(byId("run").disabled) return; setBusy(true); setTimeout(()=>{ try{ render(); } catch(e){ console.error(e); } finally { setBusy(false); } },20); };')
          s=s.replace('byId("scorelineRun").onclick=render;', 'byId("scorelineRun").onclick=()=>{ if(byId("run").disabled) return; setBusy(true); setTimeout(()=>{ try{ render(); } catch(e){ console.error(e); } finally { setBusy(false); } },20); };')
          # If the previous patch already added setBusy, do not duplicate it.
          if 'function setBusy(b)' not in s:
              s=s.replace('</script>', '''function setBusy(b){ const btn=byId("run"); if(!btn)return; btn.disabled=b; btn.textContent=b?"Calculating…":"Run prediction"; }\n</script>''', 1)
          if s != old:
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Fix predictor hanging on mobile'
          git push
