name: Add Final Decision Engine

on:
  push:
    paths:
      - 'index.html'
      - 'README.md'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add final decision engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- FINAL-DECISION-ENGINE -->'
          if marker in s:
              print('Final Decision Engine already installed')
              raise SystemExit(0)
          html='''\n<!-- FINAL-DECISION-ENGINE -->\n<section class="panel pad final-engine-panel">\n  <div class="title">Final Decision Engine</div>\n  <div class="final-engine-head"><div><h2 id="finalDecisionPick">Awaiting predictors</h2><p id="finalDecisionSummary">Run the prediction models first. This engine reads their answers and makes the final independent decision.</p></div><div class="final-score"><b id="finalDecisionScore">--/50</b><span>Decision Score</span></div></div>\n  <div class="final-bars" id="finalDecisionBars"></div><div class="final-grid" id="finalDecisionDetails"></div><div class="final-warning" id="finalDecisionWarning"></div>\n</section>\n'''
          css='''.final-engine-panel{margin-top:16px;border:1px solid var(--blue);background:linear-gradient(180deg,#141820,#0d1118)}.final-engine-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.final-engine-head h2{margin:0 0 6px;font-size:30px}.final-engine-head p{margin:0;color:var(--muted);line-height:1.45;font-size:13px}.final-score{text-align:center;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 18px;min-width:110px}.final-score b{display:block;font-size:32px;color:var(--blue)}.final-score span{color:var(--muted);font-size:11px}.final-bars{display:grid;gap:9px;margin-top:16px}.final-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.final-card{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px;min-height:72px}.final-card b{display:block;font-size:14px;margin-bottom:4px}.final-card span{color:var(--muted);font-size:11px;line-height:1.35}.final-warning{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--panel2);color:var(--muted);font-size:12px;line-height:1.45}.final-warning.strong{border-color:var(--home);color:var(--text)}.final-warning.caution{border-color:var(--away);color:var(--away)}@media(max-width:900px){.final-engine-head,.final-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.final-engine-head,.final-grid{grid-template-columns:1fr}.final-score{justify-self:start}}'''
          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('  <section class="panel pad scoreline-panel">',html+'\n  <section class="panel pad scoreline-panel">',1)
          js='''function finalDecisionEngine(inp,oracle,scoreline,independent,fifty,cluster){const keys=["1","X","2"],score={"1":0,"X":0,"2":0};const add=(out,w)=>{if(!out)return;keys.forEach(k=>{const v=Number(out[k]);if(Number.isFinite(v))score[k]+=v*w;});};add(oracle?.out,.26);add(independent?.out,.22);add(cluster?.out,.20);if(fifty?.points)keys.forEach(k=>score[k]+=(fifty.points[k]/50)*.20);if(scoreline?.ranked){const sl={"1":0,"X":0,"2":0};scoreline.ranked.slice(0,8).forEach((x,i)=>{sl[resultFromScore(x.score)]+=Number(x.pct||0)/(i+1);});const t=sl["1"]+sl.X+sl["2"]||1;keys.forEach(k=>score[k]+=(sl[k]/t)*.12);}const total=score["1"]+score.X+score["2"]||1;keys.forEach(k=>score[k]/=total);const order=[...keys].sort((a,b)=>score[b]-score[a]),top=order[0],second=order[1],gap=score[top]-score[second];const votes=[oracle?.top,scoreline?.ranked?.[0]?resultFromScore(scoreline.ranked[0].score):null,independent?.top,fifty?.top,cluster?.top].filter(Boolean);const agreement=votes.filter(v=>v===top).length,conflicts=votes.length-agreement,weak=!!(scoreline&&!scoreline.goodReference);const confidence=clamp(score[top]*.55+gap*.85+(agreement/Math.max(1,votes.length))*.25-(weak?.08:0),0,1);let decision=Math.round(confidence*50);if(agreement>=4)decision=Math.max(decision,42);if(agreement<=2)decision=Math.min(decision,34);if(gap<.035)decision=Math.min(decision,31);return{score,top,second,gap,agreement,conflicts,votes,confidence,decision,caution:agreement<3||gap<.04||weak||confidence<.58,weak};}\nfunction renderFinalDecisionEngine(inp,oracle,scoreline,independent,fifty,cluster){const f=finalDecisionEngine(inp,oracle,scoreline,independent,fifty,cluster);byId('finalDecisionPick').textContent=`${LABEL[f.top]} — ${f.caution?'CAUTION':'FINAL PICK'}`;byId('finalDecisionScore').textContent=`${f.decision}/50`;byId('finalDecisionSummary').textContent=`The Final Decision Engine reads ${f.votes.length} predictor outputs. ${f.agreement}/${f.votes.length} predictors agree on ${LABEL[f.top]}. Lead over ${LABEL[f.second]} is ${pct(f.gap)}.`;byId('finalDecisionBars').innerHTML=["1","X","2"].map(k=>`<div class="scoreline-row"><b>${LABEL[k].replace(' WIN','')}</b><div class="track"><div class="fill" style="background:${COLORS[k]};width:${(f.score[k]*100).toFixed(1)}%"></div></div><span>${(f.score[k]*50).toFixed(1)}/50</span></div>`).join('');const names=['Oracle Fusion','Scoreline','Independent','50-Point','Pattern Cluster'],vals=[oracle?.top,scoreline?.ranked?.[0]?resultFromScore(scoreline.ranked[0].score):null,independent?.top,fifty?.top,cluster?.top];byId('finalDecisionDetails').innerHTML=names.map((n,i)=>`<div class="final-card"><b>${n}</b><span>${vals[i]?LABEL[vals[i]]:'Not available'}${vals[i]===f.top?' ✓ agrees':''}</span></div>`).join('');const w=byId('finalDecisionWarning');w.className='final-warning '+(f.caution?'caution':'strong');w.textContent=f.caution?`CAUTION / NO BET CHECK: ${f.agreement}/${f.votes.length} agreement, ${f.conflicts} conflict(s), and ${f.weak?'the Scoreline reference is weak. ':''}The ${f.decision}/50 score is decision strength, not probability.`:`STRONG CONSENSUS: ${f.agreement}/${f.votes.length} predictors agree. Final decision is ${LABEL[f.top]} with ${f.decision}/50 decision strength. This is an ensemble signal, not a guarantee.`;return f;}\n'''
          s=s.replace('function render() {',js+'\nfunction render() {',1)
          s=s.replace('  const clusterRes=renderPatternClusterPredictor(inp);','  const clusterRes=renderPatternClusterPredictor(inp);\n  const finalDecision=renderFinalDecisionEngine(inp,r,scorelineRes,independentRes,fiftyRes,clusterRes);',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched predictor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes to commit'; else git commit -m 'Add Final Decision Engine ensemble predictor'; git push; fi
      - name: Close installer issue
        if: github.event_name == 'issues'
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Final Decision Engine installation completed."
