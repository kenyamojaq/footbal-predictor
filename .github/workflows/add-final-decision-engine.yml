name: Add Final Decision Engine

on:
  push:
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add final decision engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- FINAL-DECISION-ENGINE -->'
          if marker in s:
              print('Final Decision Engine already installed')
              raise SystemExit(0)

          html='''\n<!-- FINAL-DECISION-ENGINE -->\n<section class="panel pad final-engine-panel">\n  <div class="title">Final Decision Engine</div>\n  <div class="final-engine-head">\n    <div>\n      <h2 id="finalDecisionPick">Awaiting predictors</h2>\n      <p id="finalDecisionSummary">Run the prediction models first. This engine reads their answers and makes the final independent decision.</p>\n    </div>\n    <div class="final-score"><b id="finalDecisionScore">--/50</b><span>Decision Score</span></div>\n  </div>\n  <div class="final-bars" id="finalDecisionBars"></div>\n  <div class="final-grid" id="finalDecisionDetails"></div>\n  <div class="final-warning" id="finalDecisionWarning"></div>\n</section>\n'''

          css='''\n.final-engine-panel{margin-top:16px;border:1px solid var(--blue);background:linear-gradient(180deg,#141820,#0d1118)}\n.final-engine-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}\n.final-engine-head h2{margin:0 0 6px;font-size:30px}\n.final-engine-head p{margin:0;color:var(--muted);line-height:1.45;font-size:13px}\n.final-score{text-align:center;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 18px;min-width:110px}\n.final-score b{display:block;font-size:32px;color:var(--blue)}\n.final-score span{color:var(--muted);font-size:11px}\n.final-bars{display:grid;gap:9px;margin-top:16px}\n.final-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}\n.final-card{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px;min-height:72px}\n.final-card b{display:block;font-size:14px;margin-bottom:4px}\n.final-card span{color:var(--muted);font-size:11px;line-height:1.35}\n.final-warning{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--panel2);color:var(--muted);font-size:12px;line-height:1.45}\n.final-warning.strong{border-color:var(--home);color:var(--text)}\n.final-warning.caution{border-color:var(--away);color:var(--away)}\n@media(max-width:900px){.final-engine-head,.final-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:560px){.final-engine-head,.final-grid{grid-template-columns:1fr}.final-score{justify-self:start}}\n'''
          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('</section>\n\n  <section class="panel pad scoreline-panel">', '</section>'+html+'\n  <section class="panel pad scoreline-panel">',1)

          js='''\nfunction finalDecisionEngine(inp, oracle, scoreline, independent, fifty, cluster){\n  const keys=["1","X","2"];\n  const score={"1":0,"X":0,"2":0};\n  const add=(out,weight)=>{ if(!out)return; keys.forEach(k=>{ const v=Number(out[k]); if(Number.isFinite(v)) score[k]+=v*weight; }); };\n  // Final judge reads the existing predictors rather than rebuilding their raw models.\n  add(oracle?.out,.26);\n  add(independent?.out,.22);\n  add(cluster?.out,.20);\n  if(fifty?.points){ keys.forEach(k=>score[k]+=(fifty.points[k]/50)*.20); }\n  if(scoreline?.ranked){\n    const sl={"1":0,"X":0,"2":0};\n    scoreline.ranked.slice(0,8).forEach((x,i)=>{ const r=resultFromScore(x.score); sl[r]+=Number(x.pct||0)/(i+1); });\n    const t=sl["1"]+sl.X+sl["2"]||1;\n    keys.forEach(k=>score[k]+=(sl[k]/t)*.12);\n  }\n  const total=score["1"]+score.X+score["2"]||1;\n  keys.forEach(k=>score[k]/=total);\n  const order=[...keys].sort((a,b)=>score[b]-score[a]);\n  const top=order[0], second=order[1];\n  const gap=score[top]-score[second];\n  const votes=[oracle?.top,independent?.top,cluster?.top,scoreline?.ranked?.[0]?resultFromScore(scoreline.ranked[0].score):null,fifty?.top].filter(Boolean);\n  const agreement=votes.filter(v=>v===top).length;\n  const conflicts=votes.length-agreement;\n  const weak=(scoreline && !scoreline.goodReference);\n  const confidence=clamp(score[top]*.55+gap*.85+(agreement/Math.max(1,votes.length))*.25-(weak?.08:0),0,1);\n  let decision=Math.round(confidence*50);\n  if(agreement>=4) decision=Math.max(decision,42);\n  if(agreement<=2) decision=Math.min(decision,34);\n  if(gap<.035) decision=Math.min(decision,31);\n  const caution=agreement<3 || gap<.04 || weak || confidence<.58;\n  return {score,top,second,gap,agreement,conflicts,votes,confidence,decision,caution,weak};\n}\nfunction renderFinalDecisionEngine(inp, oracle, scoreline, independent, fifty, cluster){\n  const f=finalDecisionEngine(inp,oracle,scoreline,independent,fifty,cluster);\n  byId('finalDecisionPick').textContent=`${LABEL[f.top]} — ${f.caution?'CAUTION':'FINAL PICK'}`;\n  byId('finalDecisionScore').textContent=`${f.decision}/50`;\n  byId('finalDecisionSummary').textContent=`The Final Decision Engine reads ${f.votes.length} predictor outputs. ${f.agreement}/${f.votes.length} predictors agree on ${LABEL[f.top]}. Lead over ${LABEL[f.second]} is ${pct(f.gap)}.`;\n  byId('finalDecisionBars').innerHTML=["1","X","2"].map(k=>`<div class="scoreline-row"><b>${LABEL[k].replace(' WIN','')}</b><div class="track"><div class="fill" style="background:${COLORS[k]};width:${(f.score[k]*100).toFixed(1)}%"></div></div><span>${(f.score[k]*50).toFixed(1)}/50</span></div>`).join('');\n  const names=['Oracle Fusion','Scoreline','Independent','50-Point','Pattern Cluster'];\n  const vals=[oracle?.top,scoreline?.ranked?.[0]?resultFromScore(scoreline.ranked[0].score):null,independent?.top,fifty?.top,cluster?.top];\n  byId('finalDecisionDetails').innerHTML=names.map((n,i)=>`<div class="final-card"><b>${n}</b><span>${vals[i]?LABEL[vals[i]]:'Not available'}${vals[i]===f.top?' ✓ agrees':''}</span></div>`).join('');\n  const w=byId('finalDecisionWarning');\n  w.className='final-warning '+(f.caution?'caution':'strong');\n  w.textContent=f.caution ? `CAUTION / NO BET CHECK: ${f.agreement}/${f.votes.length} agreement, ${f.conflicts} conflict(s), and ${f.weak?'the Scoreline reference is weak. ':''}The ${f.decision}/50 score is a decision-strength score, not a 50% probability.` : `STRONG CONSENSUS: ${f.agreement}/${f.votes.length} predictors agree. Final decision is ${LABEL[f.top]} with ${f.decision}/50 decision strength. This is an ensemble signal, not a guarantee.`;\n  return f;\n}\n'''
          s=s.replace('function render() {',js+'\nfunction render() {',1)
          old='  const clusterRes=renderPatternClusterPredictor(inp);'
          new=old+'\n  const finalDecision=renderFinalDecisionEngine(inp, r, scorelineRes, independentRes, fiftyRes, clusterRes);'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched predictor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add Final Decision Engine ensemble predictor'
            git push
          fi
